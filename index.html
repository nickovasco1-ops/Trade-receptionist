<!DOCTYPE html>
<html lang="en-GB">

    <!-- seo:head:start -->

      Everything between these markers is replaced at build time by
      scripts/prerender.mjs, per page, from src/marketing/routes.ts: title,
      description, canonical, Open Graph, Twitter and JSON-LD. What is written
      here only shows up in `vite dev`. Edit the registry, not this block.
    -->
    <title>AI Receptionist for UK Tradespeople | Trade Receptionist</title>
    <meta name="description" content="Trade Receptionist answers your calls while you are on the tools, takes the job details, books work into your diary and texts you a summary." />
    <link rel="canonical" href="https://tradereceptionist.com/" />
    <!-- seo:head:end -->

    <!-- Favicon — orange rounded square with phone icon, matching logo mark -->

    <!-- PWA -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#051426" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Trade Rec." />

    <!-- Performance: Preconnect -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <!--
      The homepage hero image is its LCP element, but React only requests it
      after the bundle runs. Start the download while the head is still parsing.
      Done in script, not a static <link rel=preload>, because this file is also
      the SPA fallback for /login and /dashboard, which never show the hero.
      Keep the srcset in step with GENERATED_HERO_IMAGE_SRCSET in App.tsx.
    -->
    <script>
      if (location.pathname === '/') {
        var heroPreload = document.createElement('link');
        heroPreload.rel = 'preload';
        heroPreload.as = 'image';
        heroPreload.setAttribute('imagesrcset', '/assets/generated/landing-hero-768.webp 768w, /assets/generated/landing-hero-1280.webp 1280w, /assets/generated/landing-hero-1920.webp 1920w');
        heroPreload.setAttribute('imagesizes', '(max-width: 1344px) 98vw, 1344px');
        heroPreload.setAttribute('fetchpriority', 'high');
        document.head.appendChild(heroPreload);
      }
    </script>

    <!-- Industrial Luminescence: Space Grotesk (display) + Manrope (body) — trimmed to used weights only -->
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">

  </head>
  <body class="bg-navy text-offwhite font-body">
    <!-- noscript:start -->
    <noscript>
      <!--
        The SPA body is a single empty div, so anything that does not run
        JavaScript (Google's OAuth verifier, most AI crawlers) would otherwise see
        a blank document. This is the homepage in plain HTML: what the product
        does, what it costs, and real links to every section of the site. Every
        claim is checkable against shipped behaviour, per CLAUDE.md §1.1.
        scripts/prerender.mjs removes this block from pages whose body it
        prerenders, since those already carry their own content and H1.
      -->
      <main style="max-width:65ch;margin:0 auto;padding:48px 24px;font-family:Manrope,sans-serif;color:#F0F4F8;background:#051426;">
        <h1 style="font-family:'Space Grotesk',sans-serif;font-size:32px;line-height:1.1;">Trade Receptionist: an AI receptionist for UK tradespeople</h1>
        <p style="font-size:18px;line-height:1.65;color:rgba(240,244,248,0.7);">
          Trade Receptionist answers your phone when you cannot. It picks up in your
          business name, takes the caller's details and what the job is, books work
          into your diary if you connect one, politely ends sales calls, and sends
          you a text and email summary of every call. You keep your own number by
          diverting unanswered calls to it.
        </p>
        <p style="font-size:16px;line-height:1.7;color:rgba(240,244,248,0.7);">
          Plans start at £49 a month plus VAT for up to 50 calls. Every plan starts
          with a 14-day free trial, with no charge today, no setup fee and no
          contract. Trade Receptionist Ltd is registered in England &amp; Wales.
        </p>
        <h2 style="font-family:'Space Grotesk',sans-serif;font-size:22px;">By trade</h2>
        <ul style="font-size:16px;line-height:1.9;">
          <li><a href="/trades/plumbers" style="color:#FF6B2B;">AI receptionist for plumbers</a></li>
          <li><a href="/trades/electricians" style="color:#FF6B2B;">AI receptionist for electricians</a></li>
          <li><a href="/trades/builders" style="color:#FF6B2B;">Answering service for builders</a></li>
          <li><a href="/trades/heating-engineers" style="color:#FF6B2B;">Answering service for heating engineers</a></li>
          <li><a href="/trades/roofers" style="color:#FF6B2B;">Answering service for roofers</a></li>
          <li><a href="/trades/locksmiths" style="color:#FF6B2B;">24/7 answering service for locksmiths</a></li>
          <li><a href="/trades/landscapers" style="color:#FF6B2B;">Answering service for landscapers</a></li>
          <li><a href="/trades/carpenters-and-joiners" style="color:#FF6B2B;">Answering service for carpenters and joiners</a></li>
          <li><a href="/trades" style="color:#FF6B2B;">All trades</a></li>
        </ul>
        <h2 style="font-family:'Space Grotesk',sans-serif;font-size:22px;">Guides and pricing</h2>
        <ul style="font-size:16px;line-height:1.9;">
          <li><a href="/pricing" style="color:#FF6B2B;">Pricing</a></li>
          <li><a href="/guides/cost-of-missed-calls-for-tradespeople" style="color:#FF6B2B;">The cost of missed calls for tradespeople</a></li>
          <li><a href="/guides/how-to-never-miss-a-call-on-the-job" style="color:#FF6B2B;">How to never miss a call on the job</a></li>
          <li><a href="/guides/ai-receptionist-vs-answering-service-vs-voicemail" style="color:#FF6B2B;">AI receptionist vs answering service vs voicemail</a></li>
        </ul>
        <p style="font-size:16px;line-height:1.7;">
          <a href="/partner" style="color:#FF6B2B;">Partner Programme</a> ·
          <a href="/privacy" style="color:#FF6B2B;">Privacy Policy</a> ·
          <a href="/terms" style="color:#FF6B2B;">Terms of Service</a> ·
          <a href="mailto:hello@tradereceptionist.co.uk" style="color:#FF6B2B;">hello@tradereceptionist.co.uk</a>
        </p>
        <p style="font-size:15px;color:rgba(240,244,248,0.58);">
          This site needs JavaScript for the full experience. Please enable it, or
          email us and we will help you directly.
        </p>
      </main>
    </noscript>
    <!-- noscript:end -->
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
