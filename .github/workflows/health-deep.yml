name: Health (deep)

# Sunday 22:00 UTC. The deep run adds the Playwright journeys and is where
# code reading and reasoning are allowed, so it runs when a red result has the
# whole week ahead to be acted on rather than landing mid-Friday.
on:
  schedule:
    - cron: '0 22 * * 0'
  workflow_dispatch:

concurrency:
  group: health-deep
  cancel-in-progress: false

jobs:
  health:
    name: Deep health audit
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      actions: read
    # Same Playwright image CI uses. The tag must match the resolved playwright
    # version in package-lock.json or Playwright re-downloads a browser at runtime.
    container:
      image: mcr.microsoft.com/playwright:v1.59.1-noble
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm

      - run: npm ci
      - run: npm ci --prefix server

      # The Playwright journeys start a local web + API server, which needs the
      # same .env.test the e2e job builds.
      - name: Write .env.test from secrets
        run: |
          cat > .env.test <<EOF
          TEST_BASE_URL=http://localhost:3000
          TEST_EMAIL=${{ secrets.TEST_EMAIL }}
          TEST_PHONE=${{ secrets.TEST_PHONE }}
          TEST_PASSWORD=${{ secrets.TEST_PASSWORD }}
          STRIPE_TEST_CARD=4242424242424242
          STRIPE_DECLINED_CARD=4000000000000002
          STRIPE_EXPIRY=12/34
          STRIPE_CVC=123
          STRIPE_ZIP=SW1A1AA
          STRIPE_WEBHOOK_SECRET=whsec_ci_signing_secret
          SUPABASE_URL=${{ secrets.TEST_SUPABASE_URL }}
          SUPABASE_ANON_KEY=${{ secrets.TEST_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY=${{ secrets.TEST_SUPABASE_SERVICE_ROLE_KEY }}
          EOF

      - name: Restore bundle baseline
        uses: actions/cache@v4
        with:
          path: .claude/health/bundle-baseline.json
          key: bundle-baseline-${{ github.run_id }}
          restore-keys: bundle-baseline-

      - name: Run health:deep
        env:
          SUPABASE_URL: ${{ secrets.TEST_SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.TEST_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.TEST_SUPABASE_SERVICE_ROLE_KEY }}
          ADMIN_API_KEY: ${{ secrets.ADMIN_API_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RETELL_API_KEY: ${{ secrets.RETELL_API_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: npm run health:deep

      - name: Dependency audit (advisory — does not fail the run)
        if: always()
        run: |
          {
            echo '## Dependency audit'
            echo '```'
            npm audit --omit=dev 2>&1 | tail -40 || true
            echo '--- server ---'
            npm audit --omit=dev --prefix server 2>&1 | tail -40 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publish report to the job summary
        if: always()
        run: |
          FILE="reports/health/$(date -u +%F).md"
          if [ -f "$FILE" ]; then cat "$FILE" >> "$GITHUB_STEP_SUMMARY"; else
            echo "No report produced — the runner did not get far enough to write one." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload report and Playwright traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: health-deep-${{ github.run_id }}
          path: |
            reports/health/
            playwright-report/
          retention-days: 90
