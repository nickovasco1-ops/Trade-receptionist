name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same ref to save minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build (web + server)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm

      - name: Install web dependencies
        run: npm ci

      - name: Install server dependencies
        run: npm ci --prefix server

      - name: Build server (tsc)
        run: npm run build:api

      # Sentry source-map upload is gated on SENTRY_AUTH_TOKEN in vite.config.ts;
      # it is absent here, so the build runs without uploading.
      - name: Build web (vite)
        run: npm run build

      # emergency.test.ts existed but was written for bun:test, and Bun is not
      # part of this toolchain — so it had never run anywhere. Ported to
      # node:test and wired in here.
      - name: Server unit tests
        run: npm test --prefix server

  e2e:
    name: E2E (full suite)
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 20
    # Run inside Microsoft's official Playwright image: Chromium + headless-shell
    # + ffmpeg + all system libraries are pre-baked, so the job never downloads a
    # browser. This eliminates the secondary-artifact CDN stalls that hung the
    # `playwright install` step on the bare ubuntu-latest runner. The image tag
    # MUST match the resolved playwright version in package-lock.json (1.59.1) —
    # a mismatch makes Playwright try to download the missing build at runtime.
    container:
      image: mcr.microsoft.com/playwright:v1.59.1-noble
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm

      - name: Install web dependencies
        run: npm ci

      - name: Install server dependencies
        run: npm ci --prefix server

      # .env.test is gitignored — reconstruct it from repo secrets for the run.
      # Stripe test-card fixtures are public Stripe values, kept inline.
      - name: Write .env.test from secrets
        run: |
          cat > .env.test <<EOF
          TEST_BASE_URL=http://localhost:3000
          TEST_EMAIL=${{ secrets.TEST_EMAIL }}
          TEST_PHONE=${{ secrets.TEST_PHONE }}
          TEST_PASSWORD=${{ secrets.TEST_PASSWORD }}
          STRIPE_TEST_CARD=4242424242424242
          STRIPE_DECLINED_CARD=4000000000000002
          STRIPE_EXPIRY=12/34
          STRIPE_CVC=123
          STRIPE_ZIP=SW1A1AA
          # The API now FAILS CLOSED without this (failure catalogue C2a): an
          # unsigned request used to skip verification entirely. The value only
          # has to match what the test process signs with — both load this file.
          STRIPE_WEBHOOK_SECRET=whsec_ci_signing_secret
          SUPABASE_URL=${{ secrets.TEST_SUPABASE_URL }}
          SUPABASE_ANON_KEY=${{ secrets.TEST_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY=${{ secrets.TEST_SUPABASE_SERVICE_ROLE_KEY }}
          EOF

      # CI=true (set automatically by GitHub Actions) makes the Playwright
      # webServer start fresh web + API processes instead of reusing one.
      # The full suite, not a two-spec subset. CI previously ran only
      # accessibility + smoke, which is how 20 failures accumulated unnoticed
      # across settings, billing, auth, webhooks, mobile and dashboard — two of
      # them real product bugs. A suite nobody runs is a suite nobody trusts.
      - name: E2E suite
        run: npm run test:e2e

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
