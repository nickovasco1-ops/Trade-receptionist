name: Notion Sync

# Every 2 hours. The sync reconciles rather than appends, so running it often is
# cheap and running it twice changes nothing.
on:
  schedule:
    - cron: '0 */2 * * *'
  workflow_dispatch:

jobs:
  sync:
    name: Reconcile ops data into Notion
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Run sync
        run: |
          RESPONSE=$(curl -s -w "\n%{http_code}" -X POST \
            https://trade-receptionist-production.up.railway.app/admin/sync-notion \
            -H "X-Admin-Key: ${{ secrets.ADMIN_API_KEY }}" \
            -H "Content-Type: application/json" -d '{}')
          BODY=$(echo "$RESPONSE" | head -n -1)
          STATUS=$(echo "$RESPONSE" | tail -n 1)
          echo "$BODY"

          if [ "$STATUS" != "200" ]; then
            echo "::error::Notion sync failed — HTTP $STATUS"
            exit 1
          fi

          # Each result carries a `reason` when it did not sync cleanly. Print it.
          # This job emailed "5 failed rows" every two hours for six days while the
          # cause — the integration had never been shared the Subscribers database —
          # was only ever visible in Sentry. A count is not a diagnosis.
          echo "$BODY" | jq -r '
            .data[]
            | select((.failed // 0) > 0 or (.skipped // 0) > 0)
            | "\(.database): created=\(.created) updated=\(.updated) skipped=\(.skipped) failed=\(.failed)"
              + (if .reason then "\n  reason: " + .reason else "" end)'

          FAILED=$(echo "$BODY" | jq '[.data[].failed // 0] | add // 0')
          if [ "$FAILED" -gt 0 ]; then
            # Notion answers an unshared database with "Could not find database with
            # ID <id>" — the fix is Notion-side (••• → Connections → add the
            # integration), not a code change.
            REASONS=$(echo "$BODY" | jq -r '[.data[] | select((.failed // 0) > 0)
              | "\(.database): \(.reason // "no reason reported")"] | join(" | ")')
            echo "::error::Notion sync failed — $REASONS"
            exit 1
          fi

          # A database left unconfigured never syncs and never complains. That is
          # how the Leads database sat empty: skipped is not the same as clean.
          SKIPPED=$(echo "$BODY" | jq '[.data[].skipped // 0] | add // 0')
          if [ "$SKIPPED" -gt 0 ]; then
            REASONS=$(echo "$BODY" | jq -r '[.data[] | select((.skipped // 0) > 0)
              | "\(.database): \(.reason // "skipped")"] | join(" | ")')
            echo "::warning::Notion sync skipped a database — $REASONS"
          fi

          echo "Notion sync clean"
