name: Daily report (lines + diaries)

on:
  schedule:
    # 06:30 UTC daily (07:30 BST) — before the trades' working day, so a dead
    # line or diary is found before a caller finds it.
    - cron: '30 6 * * *'
  workflow_dispatch:

jobs:
  daily-report:
    name: POST /admin/daily-report
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check every line and diary, email the owner
        run: |
          STATUS=$(curl -s -o /tmp/body.json -w "%{http_code}" \
            -X POST https://trade-receptionist-production.up.railway.app/admin/daily-report \
            -H "X-Admin-Key: ${{ secrets.ADMIN_API_KEY }}" \
            -H "Content-Type: application/json")

          echo "HTTP $STATUS"
          jq . /tmp/body.json || cat /tmp/body.json

          if [ "$STATUS" -lt 200 ] || [ "$STATUS" -ge 300 ]; then
            echo "::error::daily-report returned HTTP $STATUS"
            exit 1
          fi

          # A 2xx is not success — read the body. notification-health.yml was
          # green for 20 runs while the thing it checked was failing.
          DEAD=$(jq -r '.data.needsReconnect // "null"' /tmp/body.json)
          CHECKED=$(jq -r '.data.tenantsChecked // "null"' /tmp/body.json)
          FAILED=$(jq -r '.data.failedCalls // "null"' /tmp/body.json)
          UNCHECKED=$(jq -r '.data.linesUnchecked // "null"' /tmp/body.json)
          EMAILED=$(jq -r '.data.emailed // "null"' /tmp/body.json)

          if [ "$DEAD" = "null" ] || [ "$CHECKED" = "null" ] || [ "$FAILED" = "null" ]; then
            echo "::error::Response carried no report — treating as a failed run, not an idle one"
            exit 1
          fi

          {
            echo "### $(jq -r '.data.subject' /tmp/body.json)"
            jq -r '.data.calendars[] | "- \(.businessName): diary \(.provider) — \(.status)"' /tmp/body.json
            jq -r '.data.lines[] | "- \(.businessName): \(.calls) call(s) in 24h, faults \(.faults | tostring)\(if .error then " — NOT CHECKED: " + .error else "" end)"' /tmp/body.json
          } >> "$GITHUB_STEP_SUMMARY"

          FAIL=0
          if [ "$EMAILED" != "true" ]; then
            echo "::error::The report was not emailed — set ALERT_EMAIL in Railway"
            FAIL=1
          fi
          if [ "$FAILED" -gt 0 ]; then
            echo "::error::$FAILED call(s) in the last 24h were ended by the platform, not the caller"
            FAIL=1
          fi
          if [ "$DEAD" -gt 0 ]; then
            echo "::error::$DEAD tenant(s) cannot reach their diary — their receptionist cannot book a job"
            FAIL=1
          fi
          if [ "$UNCHECKED" -gt 0 ]; then
            echo "::error::$UNCHECKED line(s) could not be checked"
            FAIL=1
          fi
          exit $FAIL
